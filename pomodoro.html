<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟 · 喫茶</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           日式喫茶店风格 · Kissaten Pomodoro
           ============================================ */

        :root {
            --paper: #F7F3EE;
            --paper-deep: #EDE7DF;
            --ink: #2C2420;
            --ink-light: #5C5048;
            --ink-faint: #9A8E84;
            --tomato: #C94A4A;
            --tomato-soft: #D97A7A;
            --tomato-glow: rgba(201, 74, 74, 0.12);
            --mint: #5A9E7A;
            --mint-soft: #8ABFA0;
            --mint-glow: rgba(90, 158, 122, 0.12);
            --sky: #5A8EAE;
            --sky-soft: #8AB0C8;
            --sky-glow: rgba(90, 142, 174, 0.12);
            --wood: #8B7355;
            --wood-light: #B8A080;
            --shadow-soft: 0 4px 20px rgba(44, 36, 32, 0.06);
            --shadow-medium: 0 8px 32px rgba(44, 36, 32, 0.10);
            --radius-drawn: 24px 28px 22px 26px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
            background: var(--paper);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--ink);
            overflow-x: hidden;
        }

        /* 背景纹理层 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 2rem;
            max-width: 480px;
            width: 100%;
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 标题 */
        .brand {
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .brand h1 {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: 0.15em;
            line-height: 1.3;
        }

        .brand .sub {
            font-size: 0.8rem;
            color: var(--ink-faint);
            letter-spacing: 0.3em;
            margin-top: 0.5rem;
            font-weight: 400;
        }

        .brand .divider {
            width: 40px;
            height: 2px;
            background: var(--wood-light);
            margin: 1rem auto 0;
            border-radius: 1px;
        }

        /* 任务输入 */
        .task-input {
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .task-input input {
            width: 100%;
            max-width: 360px;
            padding: 1rem 1.8rem;
            border: 1.5px solid var(--paper-deep);
            border-radius: var(--radius-drawn);
            background: #FFFCF8;
            color: var(--ink);
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 0.95rem;
            text-align: center;
            outline: none;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: var(--shadow-soft);
        }

        .task-input input::placeholder {
            color: var(--ink-faint);
            font-size: 0.9rem;
        }

        .task-input input:focus {
            border-color: var(--wood-light);
            box-shadow: 0 4px 24px rgba(139, 115, 85, 0.1), var(--shadow-soft);
            transform: translateY(-1px);
        }

        /* 模式切换 */
        .mode-tabs {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .mode-btn {
            padding: 0.6rem 1.4rem;
            border: 1.5px solid var(--paper-deep);
            border-radius: var(--radius-drawn);
            background: #FFFCF8;
            color: var(--ink-light);
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--tomato);
            opacity: 0;
            transition: opacity 0.4s ease;
            border-radius: inherit;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
            border-color: transparent;
        }

        .mode-btn:hover::before {
            opacity: 0.06;
        }

        .mode-btn.active {
            background: var(--tomato);
            color: #FFFCF8;
            border-color: var(--tomato);
            box-shadow: 0 6px 24px var(--tomato-glow);
        }

        .mode-btn.active[data-mode="shortBreak"] {
            background: var(--mint);
            border-color: var(--mint);
            box-shadow: 0 6px 24px var(--mint-glow);
        }

        .mode-btn.active[data-mode="longBreak"] {
            background: var(--sky);
            border-color: var(--sky);
            box-shadow: 0 6px 24px var(--sky-glow);
        }

        /* 计时器圆环 */
        .timer-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 2.5rem;
            animation: fadeInUp 0.8s 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .timer-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                var(--progress-color, var(--tomato)) var(--progress, 0%),
                var(--paper-deep) var(--progress, 0%)
            );
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                inset 0 2px 8px rgba(44, 36, 32, 0.04),
                0 8px 40px rgba(44, 36, 32, 0.08);
            transition: background 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }

        .timer-circle::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: var(--paper);
            z-index: 0;
        }

        .timer-inner {
            position: relative;
            z-index: 1;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: #FFFCF8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow:
                inset 0 2px 6px rgba(44, 36, 32, 0.03),
                0 2px 12px rgba(44, 36, 32, 0.04);
        }

        .timer-display {
            font-family: 'Noto Serif SC', serif;
            font-size: 3.6rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: 0.08em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            transition: color 0.4s ease;
        }

        .timer-label {
            font-size: 0.85rem;
            color: var(--ink-faint);
            margin-top: 0.6rem;
            letter-spacing: 0.15em;
            font-weight: 500;
            transition: color 0.4s ease;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 1.25rem;
            justify-content: center;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1.5px solid var(--paper-deep);
            background: #FFFCF8;
            color: var(--ink-light);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-soft);
        }

        .control-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: var(--shadow-medium);
            border-color: var(--wood-light);
            color: var(--ink);
        }

        .control-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .control-btn.primary {
            width: 72px;
            height: 72px;
            background: var(--tomato);
            color: #FFFCF8;
            border-color: var(--tomato);
            box-shadow: 0 6px 24px var(--tomato-glow);
        }

        .control-btn.primary:hover {
            background: var(--tomato-soft);
            border-color: var(--tomato-soft);
            box-shadow: 0 8px 32px var(--tomato-glow);
            color: #FFFCF8;
        }

        /* 统计数据 */
        .stats {
            display: flex;
            gap: 3rem;
            justify-content: center;
            animation: fadeInUp 0.8s 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--ink-faint);
            margin-top: 0.4rem;
            letter-spacing: 0.1em;
        }

        /* 装饰元素 */
        .deco-leaf {
            position: fixed;
            width: 120px;
            height: 120px;
            opacity: 0.04;
            pointer-events: none;
            z-index: 0;
        }

        .deco-leaf.top-right {
            top: -20px;
            right: -20px;
            transform: rotate(45deg);
        }

        .deco-leaf.bottom-left {
            bottom: -30px;
            left: -30px;
            transform: rotate(-135deg);
        }

        /* 完成时的庆祝动画 */
        @keyframes celebrate {
            0% { transform: scale(1); }
            25% { transform: scale(1.08); }
            50% { transform: scale(0.98); }
            75% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .celebrating .timer-wrapper {
            animation: celebrate 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .container { padding: 2rem 1.5rem; }
            .brand h1 { font-size: 1.8rem; }
            .timer-wrapper { width: 240px; height: 240px; }
            .timer-inner { width: 196px; height: 196px; }
            .timer-display { font-size: 3rem; }
            .mode-btn { padding: 0.5rem 1rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <!-- 装饰叶片 -->
    <svg class="deco-leaf top-right" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M50 10 Q80 30 85 60 Q70 85 50 95 Q30 85 15 60 Q20 30 50 10Z"/>
        <path d="M50 10 Q50 50 50 95"/>
    </svg>
    <svg class="deco-leaf bottom-left" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M50 10 Q80 30 85 60 Q70 85 50 95 Q30 85 15 60 Q20 30 50 10Z"/>
        <path d="M50 10 Q50 50 50 95"/>
    </svg>

    <div class="container">
        <div class="brand">
            <h1>番茄钟</h1>
            <div class="sub">POMODORO TIMER</div>
            <div class="divider"></div>
        </div>

        <div class="task-input">
            <input type="text" id="taskInput" placeholder="此刻专注的事..." />
        </div>

        <div class="mode-tabs">
            <button class="mode-btn active" data-mode="pomodoro" data-time="25">专注</button>
            <button class="mode-btn" data-mode="shortBreak" data-time="5">短休息</button>
            <button class="mode-btn" data-mode="longBreak" data-time="15">长休息</button>
        </div>

        <div class="timer-wrapper">
            <div class="timer-circle" id="timerCircle">
                <div class="timer-inner">
                    <div class="timer-display" id="timerDisplay">25:00</div>
                    <div class="timer-label" id="timerLabel">准备开始</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn secondary" id="resetBtn" title="重置">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
            </button>

            <button class="control-btn primary" id="toggleBtn" title="开始/暂停">
                <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="pauseIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <button class="control-btn secondary" id="skipBtn" title="跳过">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M5 4l10 8-10 8V4z"/>
                    <path d="M19 5v14"/>
                </svg>
            </button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="completedCount">0</div>
                <div class="stat-label">今日完成</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalFocusTime">0</div>
                <div class="stat-label">专注分钟</div>
            </div>
        </div>
    </div>

    <script>
        const MODES = {
            pomodoro:   { time: 25 * 60, color: 'var(--tomato)', label: '专注中' },
            shortBreak: { time: 5 * 60,  color: 'var(--mint)',   label: '短休息' },
            longBreak:  { time: 15 * 60, color: 'var(--sky)',    label: '长休息' }
        };

        let currentMode = 'pomodoro';
        let timeLeft = MODES.pomodoro.time;
        let totalTime = MODES.pomodoro.time;
        let isRunning = false;
        let timerInterval = null;

        let completedPomodoros = parseInt(localStorage.getItem('completedPomodoros') || '0');
        let totalFocusMinutes = parseInt(localStorage.getItem('totalFocusMinutes') || '0');
        let lastDate = localStorage.getItem('lastDate') || new Date().toDateString();

        const timerDisplay = document.getElementById('timerDisplay');
        const timerLabel = document.getElementById('timerLabel');
        const timerCircle = document.getElementById('timerCircle');
        const toggleBtn = document.getElementById('toggleBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const resetBtn = document.getElementById('resetBtn');
        const skipBtn = document.getElementById('skipBtn');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const completedCount = document.getElementById('completedCount');
        const totalFocusTime = document.getElementById('totalFocusTime');
        const taskInput = document.getElementById('taskInput');

        function checkNewDay() {
            const today = new Date().toDateString();
            if (lastDate !== today) {
                completedPomodoros = 0;
                totalFocusMinutes = 0;
                lastDate = today;
                saveStats();
            }
        }

        function saveStats() {
            localStorage.setItem('completedPomodoros', completedPomodoros);
            localStorage.setItem('totalFocusMinutes', totalFocusMinutes);
            localStorage.setItem('lastDate', lastDate);
        }

        function updateStats() {
            completedCount.textContent = completedPomodoros;
            totalFocusTime.textContent = totalFocusMinutes;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
            const progress = ((totalTime - timeLeft) / totalTime) * 100;
            timerCircle.style.setProperty('--progress', `${progress}%`);
        }

        function setMode(mode) {
            currentMode = mode;
            totalTime = MODES[mode].time;
            timeLeft = totalTime;
            timerCircle.style.setProperty('--progress-color', MODES[mode].color);
            timerLabel.textContent = isRunning ? MODES[mode].label : '准备开始';
            updateDisplay();

            modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            isRunning = true;
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            timerLabel.textContent = MODES[currentMode].label;

            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    completeTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            timerLabel.textContent = '已暂停';
            clearInterval(timerInterval);
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = totalTime;
            timerLabel.textContent = '准备开始';
            updateDisplay();
        }

        function completeTimer() {
            pauseTimer();
            document.body.classList.add('celebrating');
            setTimeout(() => document.body.classList.remove('celebrating'), 600);

            if (currentMode === 'pomodoro') {
                completedPomodoros++;
                totalFocusMinutes += Math.floor(MODES.pomodoro.time / 60);
                saveStats();
                updateStats();

                if (completedPomodoros % 4 === 0) {
                    setMode('longBreak');
                } else {
                    setMode('shortBreak');
                }
            } else {
                setMode('pomodoro');
            }

            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('番茄钟', {
                    body: currentMode === 'pomodoro'
                        ? '专注时间结束，休息一下吧！'
                        : '休息结束，开始专注！',
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🍅</text></svg>'
                });
            }
        }

        function skipTimer() {
            pauseTimer();
            if (currentMode === 'pomodoro') {
                setMode('shortBreak');
            } else {
                setMode('pomodoro');
            }
        }

        toggleBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);
        skipBtn.addEventListener('click', skipTimer);

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isRunning) pauseTimer();
                setMode(btn.dataset.mode);
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleTimer();
            }
        });

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        checkNewDay();
        updateStats();
        setMode('pomodoro');
    </script>
</body>
</html>
